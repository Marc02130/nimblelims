name: CI

on:
  push:
    branches: [main, calculations]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint (ruff F821)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      # F821 = undefined name: catches latent NameErrors before they reach a request.
      - name: ruff check --select F821
        run: ruff check --select F821 backend/app backend/tests
      # Zero is a real measurement. Ruff has no rule for this, and
      # @typescript-eslint/prefer-nullish-coalescing would flag every ||
      # including strings. This check is limited to named numeric fields.
      - name: numeric truthiness
        run: python backend/checks/numeric_truthiness.py
      # Instant columns are timestamptz. utcnow() and naive now() are rejected
      # in server code. Tests and already-applied migrations are outside this scan.
      - name: naive instant writes
        run: python backend/checks/naive_instants.py

  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      # Tests start Postgres themselves (testcontainers, pgvector/pgvector:pg15).
      # conftest creates roles the same way db/zz-roles.sh does, runs Alembic as
      # non-superuser lims_migrate, then runs db/scripts/uat_privilege_snapshot.sql.
      - name: pytest
        working-directory: backend
        run: python -m pytest -q --tb=line
        env:
          ENVIRONMENT: test
          ALLOW_INSECURE_DEFAULTS: "true"
          SECRET_KEY: pytest-secret-key-not-for-production
          # Import builds an engine. No password. Migrations use lims_migrate on the testcontainer.
          DATABASE_URL: postgresql://lims_app@127.0.0.1:5432/lims_db

  frontend:
    name: Frontend tests and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches frontend/Dockerfile (node:18, npm 10) so `npm ci` uses the same lockfile rules.
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test -- --watchAll=false
        env:
          CI: "true"
      - name: Type check
        run: npx tsc --noEmit

  r-calculator-pin:
    name: R service pin (S1)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The lock hash recompute imports the backend module. It does not need
      # the database or the rest of requirements.txt.
      - name: Pin, two builds, sandbox inspect
        run: bash services/r-calculator/scripts/ci-pin.sh
      # The KAT harness runs from the backend against the pinned container.
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: KAT harness on the pinned image (S2)
        run: bash services/r-calculator/scripts/ci-kat.sh lims-r-pin-a
      - name: R-side catalog functions on the pinned image (S3)
        run: bash services/r-calculator/scripts/ci-catalog.sh lims-r-pin-a
