# Frontend CRA + r-calculator in parallel OOMs Docker Desktop (~8GB).
# COMPOSE_PARALLEL_LIMIT=1 docker compose up -d --build
services:
  # PostgreSQL Database
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: lims-db
    environment:
      POSTGRES_DB: lims_db
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      LIMS_MIGRATE_PASSWORD: ${LIMS_MIGRATE_PASSWORD:?Set LIMS_MIGRATE_PASSWORD}
      LIMS_APP_PASSWORD: ${LIMS_APP_PASSWORD:?Set LIMS_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/zz-roles.sh:/docker-entrypoint-initdb.d/zz-roles.sh
    ports:
      - "5432:5432"
    networks:
      - lims-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d lims_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Local mailbox only. Same Mailpit image as arpw-local. Inbox is :8025
  # (arpw-local uses :8026, arpw Supabase uses :54324). SMTP stays on the
  # compose network and is not published.
  mail:
    image: axllent/mailpit:latest
    container_name: lims-mail
    ports:
      - "8025:8025"
    networks:
      - lims-network
    restart: unless-stopped

  # R/Plumber service. Internal network only, no host port.
  # CALC-REQ-4a: non-root, read-only root, tmpfs scratch, no egress,
  # CPU / memory / PID limits. R_IMAGE_DIGEST is the built image id supplied
  # at deploy time (Spec §2). It is not baked at build, and it is not part of
  # the lock hash. Unset, calculation calls are refused; POST /fit still runs.
  r-calculator:
    build:
      context: ./services/r-calculator
      dockerfile: Dockerfile
      args:
        R_BASE_DIGEST: ${R_BASE_DIGEST:-}
        R_TREE: ${R_TREE:-}
    container_name: lims-r-calculator
    # No host port is published. FastAPI calls http://r-calculator:8000 on r-internal.
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=268435456
    cpus: "1.0"
    mem_limit: 1536m
    pids_limit: 256
    environment:
      R_IMAGE_DIGEST: ${R_IMAGE_DIGEST:-}
      R_SCRATCH_PATH: /tmp
      HOME: /tmp
      TMPDIR: /tmp
      TMP: /tmp
      TEMP: /tmp
      XDG_CACHE_HOME: /tmp
    networks:
      - r-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # R package loading takes ~30s on first start

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lims-backend
    environment:
      # Runtime app uses lims_app. Alembic uses lims_migrate.
      DATABASE_URL: postgresql://lims_app:${LIMS_APP_PASSWORD:?Set LIMS_APP_PASSWORD}@db:5432/lims_db
      MIGRATE_DATABASE_URL: postgresql://lims_migrate:${LIMS_MIGRATE_PASSWORD:?Set LIMS_MIGRATE_PASSWORD}@db:5432/lims_db
      LIMS_APP_PASSWORD: ${LIMS_APP_PASSWORD:?Set LIMS_APP_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: lims_db
      DB_USER: lims_app
      DB_PASSWORD: ${LIMS_APP_PASSWORD:?Set LIMS_APP_PASSWORD}
      # S3: app reads SECRET_KEY (JWT_SECRET_KEY is the alias). Compose refuses
      # to start when it is missing. The value lives in the untracked .env.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      JWT_SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DEBUG: "True"
      ENVIRONMENT: development
      ALLOW_INSECURE_DEFAULTS: "true"
      ALLOW_DEV_SEED_USERS: "true"
      R_CALCULATOR_URL: http://r-calculator:8000
      # Local MiniLM (384-d), same as ragged. Tests set EMBEDDING_PROVIDER=stub.
      EMBEDDING_PROVIDER: local
      # Optional fallbacks when Configuring agent has no stored key. Never a fake key.
      # OPENAI_API_KEY:
      # XAI_API_KEY:
      # ANTHROPIC_API_KEY:
      # Mailpit on the compose network. No login and no STARTTLS.
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@localhost
      SMTP_TLS: "false"
      SMTP_SSL: "false"
      PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "8000:8000"
    networks:
      - lims-network
      - r-internal
    depends_on:
      db:
        condition: service_healthy
      r-calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lims-frontend
    ports:
      - "3000:3000"
    networks:
      - lims-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MCP sidecar. HTTP client to backend only. Read-only unless MCP_READ_ONLY=false.
  # No database URL. Do not put a real token in NIMBLELIMS_ACCESS_TOKEN here.
  mcp:
    build:
      context: ./services/mcp
      dockerfile: Dockerfile
    container_name: lims-mcp
    environment:
      BACKEND_BASE_URL: http://backend:8000
      MCP_READ_ONLY: "true"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8100"
      # NIMBLELIMS_ACCESS_TOKEN:
    ports:
      - "8100:8100"
    networks:
      - lims-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    driver: local

networks:
  lims-network:
    driver: bridge
  # No route off this network. r-calculator is the only service that is
  # exclusively here, so it cannot reach the internet or the database.
  r-internal:
    driver: bridge
    internal: true
