# Frontend CRA + r-calculator in parallel OOMs Docker Desktop (~8GB).
# COMPOSE_PARALLEL_LIMIT=1 docker compose up -d --build
services:
  # PostgreSQL Database
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: lims-db
    environment:
      POSTGRES_DB: lims_db
      POSTGRES_USER: lims_user
      POSTGRES_PASSWORD: lims_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - lims-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lims_user -d lims_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Local mailbox only. Same Mailpit image as arpw-local. Inbox is :8025
  # (arpw-local uses :8026, arpw Supabase uses :54324). SMTP stays on the
  # compose network and is not published.
  mail:
    image: axllent/mailpit:latest
    container_name: lims-mail
    ports:
      - "8025:8025"
    networks:
      - lims-network
    restart: unless-stopped

  # R/Plumber curve fitting service — internal only, never exposed to host
  r-calculator:
    build:
      context: ./services/r-calculator
      dockerfile: Dockerfile
    container_name: lims-r-calculator
    # NOTE: No `ports:` block — this service is accessible only within lims-network.
    # FastAPI calls it via http://r-calculator:8000. Never expose this to the host.
    networks:
      - lims-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # R package loading takes ~30s on first start

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lims-backend
    environment:
      # P0d: runtime app uses lims_app; migrations/ensure use owner lims_user
      DATABASE_URL: postgresql://lims_app:lims_app_password@db:5432/lims_db
      MIGRATE_DATABASE_URL: postgresql://lims_user:lims_password@db:5432/lims_db
      LIMS_APP_PASSWORD: lims_app_password
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: lims_db
      DB_USER: lims_app
      DB_PASSWORD: lims_app_password
      # S3: app reads SECRET_KEY (JWT_SECRET_KEY accepted as alias). Local compose
      # allows the placeholder only because ALLOW_INSECURE_DEFAULTS=true.
      SECRET_KEY: your-secret-key-change-in-production
      JWT_SECRET_KEY: your-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DEBUG: "True"
      ENVIRONMENT: development
      ALLOW_INSECURE_DEFAULTS: "true"
      ALLOW_DEV_SEED_USERS: "true"
      R_CALCULATOR_URL: http://r-calculator:8000
      # Local MiniLM (384-d), same as ragged. Tests set EMBEDDING_PROVIDER=stub.
      EMBEDDING_PROVIDER: local
      # Optional fallbacks when Configuring agent has no stored key. Never a fake key.
      # OPENAI_API_KEY:
      # XAI_API_KEY:
      # ANTHROPIC_API_KEY:
      # Mailpit on the compose network. No login and no STARTTLS.
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@localhost
      SMTP_TLS: "false"
      SMTP_SSL: "false"
      PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "8000:8000"
    networks:
      - lims-network
    depends_on:
      db:
        condition: service_healthy
      r-calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lims-frontend
    ports:
      - "3000:3000"
    networks:
      - lims-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MCP sidecar. HTTP client to backend only. Read-only unless MCP_READ_ONLY=false.
  # No database URL. Do not put a real token in NIMBLELIMS_ACCESS_TOKEN here.
  mcp:
    build:
      context: ./services/mcp
      dockerfile: Dockerfile
    container_name: lims-mcp
    environment:
      BACKEND_BASE_URL: http://backend:8000
      MCP_READ_ONLY: "true"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8100"
      # NIMBLELIMS_ACCESS_TOKEN:
    ports:
      - "8100:8100"
    networks:
      - lims-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    driver: local

networks:
  lims-network:
    driver: bridge
